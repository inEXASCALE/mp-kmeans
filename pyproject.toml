[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-kmeans"
version = "0.1.1"
description = "CUDA-accelerated mixed-precision k-means clustering for large-scale data."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "InEXASCALE" }
]
maintainers = [
  { name = "Erin Carson, Xinye Chen, Xiaobo Liu", email = "xinyechenai@gmail.com" }
]
keywords = ["kmeans", "clustering", "mixed-precision", "cuda", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis"
]
dependencies = ["euclimix>=0.1.2,<0.2", "torch>=2.11,<3"]

[project.optional-dependencies]
benchmark = ["numpy>=1.21", "scikit-learn>=1.0"]

[project.urls]
Homepage = "https://github.com/inEXASCALE/mp-kmeans"
Repository = "https://github.com/inEXASCALE/mp-kmeans"
Issues = "https://github.com/inEXASCALE/mp-kmeans/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["mp_kmeans*"]
